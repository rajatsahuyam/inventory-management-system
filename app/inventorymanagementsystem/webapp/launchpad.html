<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Inventory Management System</title>
    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-libs="sap.m, sap.ui.core, sap.f"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true"
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatversion="edge"
        data-sap-ui-frameOptions="allow"
    ></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #f5f6f7;
        }
        .launchpad-shell {
            font-family: '72', Arial, sans-serif;
        }
        .shell-header {
            background: #0070f2;
            color: white;
            padding: 0 2rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .shell-header h1 {
            font-size: 1rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.3px;
        }
        .shell-header span {
            font-size: 0.8rem;
            opacity: 0.85;
        }
        .launchpad-body {
            padding: 2.5rem 3rem;
        }
        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #556b82;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 1.2rem;
        }
        .tile-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .tile {
            background: white;
            border-radius: 0.5rem;
            width: 11rem;
            height: 11rem;
            padding: 1.25rem;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            border: 1px solid #e5e5e5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: box-shadow 0.15s ease, transform 0.15s ease;
            text-decoration: none;
            color: inherit;
        }
        .tile:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.13);
            transform: translateY(-2px);
        }
        .tile:active {
            transform: translateY(0);
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .tile-icon {
            font-size: 2rem;
        }
        .tile-footer {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .tile-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #1d2d3e;
        }
        .tile-subtitle {
            font-size: 0.75rem;
            color: #556b82;
        }
        .tile-count {
            font-size: 1.6rem;
            font-weight: 300;
            color: #0070f2;
            margin-bottom: 0.25rem;
        }
        .tile-count.warning { color: #e76500; }
        .tile-count.error   { color: #bb0000; }
        .tile-count.success { color: #107e3e; }
        .loading { color: #aaa; font-size: 1rem; }
    </style>
</head>
<body class="launchpad-shell">

<div class="shell-header">
    <h1>Inventory Management System</h1>
    <span>SAP CAP Training Project</span>
</div>

<div class="launchpad-body">
    <div class="section-title">My Apps</div>
    <div class="tile-grid">

        <!-- Products Tile -->
        <a class="tile" href="index.html#/Products">
            <div class="tile-icon">📦</div>
            <div class="tile-footer">
                <div class="tile-count" id="totalProducts">
                    <span class="loading">...</span>
                </div>
                <div class="tile-title">Products</div>
                <div class="tile-subtitle">Manage inventory</div>
            </div>
        </a>

        <!-- Low Stock Tile -->
        <a class="tile" href="index.html#/Products?filter=lowStock">
            <div class="tile-icon">⚠️</div>
            <div class="tile-footer">
                <div class="tile-count warning" id="lowStockCount">
                    <span class="loading">...</span>
                </div>
                <div class="tile-title">Low Stock</div>
                <div class="tile-subtitle">Needs attention</div>
            </div>
        </a>

        <!-- Out of Stock Tile -->
        <a class="tile" href="index.html#/Products">
            <div class="tile-icon">🚫</div>
            <div class="tile-footer">
                <div class="tile-count error" id="outOfStockCount">
                    <span class="loading">...</span>
                </div>
                <div class="tile-title">Out of Stock</div>
                <div class="tile-subtitle">Requires restock</div>
            </div>
        </a>

        <!-- Orders Tile -->
        <a class="tile" href="index.html#/Orders">
            <div class="tile-icon">🧾</div>
            <div class="tile-footer">
                <div class="tile-count" id="totalOrders">
                    <span class="loading">...</span>
                </div>
                <div class="tile-title">Orders</div>
                <div class="tile-subtitle">Manage orders</div>
            </div>
        </a>

        <!-- Pending Orders Tile -->
        <a class="tile" href="index.html#/Orders">
            <div class="tile-icon">🕐</div>
            <div class="tile-footer">
                <div class="tile-count warning" id="pendingOrders">
                    <span class="loading">...</span>
                </div>
                <div class="tile-title">Pending Orders</div>
                <div class="tile-subtitle">Awaiting approval</div>
            </div>
        </a>

        <!-- Suppliers Tile -->
        <a class="tile" href="index.html#/Products">
            <div class="tile-icon">🏭</div>
            <div class="tile-footer">
                <div class="tile-count success" id="totalSuppliers">
                    <span class="loading">...</span>
                </div>
                <div class="tile-title">Suppliers</div>
                <div class="tile-subtitle">Active vendors</div>
            </div>
        </a>

    </div>
</div>

<script>
    const BASE = '/odata/v4/inventory';

    async function fetchCount(entity, filter) {
        const url = filter
            ? `${BASE}/${entity}/$count?$filter=${filter}`
            : `${BASE}/${entity}/$count`;
        const res = await fetch(url);
        return res.ok ? await res.text() : '—';
    }

    async function loadTiles() {
        try {
            const [
                totalProducts,
                outOfStock,
                totalOrders,
                pendingOrders,
                totalSuppliers,
                allProducts
            ] = await Promise.all([
                fetchCount('Products'),
                fetchCount('Products', 'stock eq 0'),
                fetchCount('Orders'),
                fetchCount('Orders', "status eq 'N'"),
                fetchCount('Suppliers'),
                fetch(`${BASE}/Products?$select=stock,criticalStock`).then(r => r.json())
            ]);

            // Low stock = stock > 0 but stock < criticalStock
            const lowStock = allProducts.value.filter(
                p => p.stock > 0 && p.stock < p.criticalStock
            ).length;

            document.getElementById('totalProducts').textContent  = totalProducts;
            document.getElementById('outOfStockCount').textContent = outOfStock;
            document.getElementById('lowStockCount').textContent   = lowStock;
            document.getElementById('totalOrders').textContent     = totalOrders;
            document.getElementById('pendingOrders').textContent   = pendingOrders;
            document.getElementById('totalSuppliers').textContent  = totalSuppliers;

        } catch (e) {
            console.error('Failed to load tile data', e);
        }
    }

    loadTiles();
</script>

</body>
</html>
